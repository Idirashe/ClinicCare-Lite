<!DOCTYPE html>
<html>
<head>
    <title>ClinicCare-Lite - Login</title>
    <!-- Bootstrap gives us usable styling for free without writing much CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container" style="max-width: 400px; margin-top: 80px;">
    <h1 class="mb-4">ClinicCare-Lite</h1>

    <!-- Flask's flash() messages (errors, confirmations) show up here -->
    {% with messages = get_flashed_messages() %}
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-warning">{{ message }}</div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form method="POST" action="{{ url_for('login') }}">
        <div class="mb-3">
            <label class="form-label">User ID</label>
            <input type="text" name="user_id" class="form-control" required maxlength="8">
        </div>
        <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" name="password" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">Log in</button>
    </form>

    <p class="mt-3 text-center">
        <a href="{{ url_for('register') }}">Don't have an account? Register</a>
    </p>
</div>
</body>
</html>
