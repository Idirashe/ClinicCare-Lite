{% extends "base.html" %}
{% block title %}Login — ClinicCare-Lite{% endblock %}
{% block content %}
<h1>ClinicCare-Lite Login</h1>
<form method="POST">
    <label>ID (8 digits)</label>
    <input type="text" name="user_id" maxlength="8" required>

    <label>Password</label>
    <input type="password" name="password" required>

    <button type="submit">Log In</button>
</form>
<p>No account? <a href="{{ url_for('auth.register') }}">Register here</a></p>
{% endblock %}
