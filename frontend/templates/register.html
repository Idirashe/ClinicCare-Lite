{% extends "base.html" %}
{% block title %}Register — ClinicCare-Lite{% endblock %}
{% block content %}
<h1>ClinicCare-Lite Registration</h1>
<form method="POST">
    <label>Role</label>
    <select name="role" required>
        <option value="patient">Patient</option>
        <option value="clinician">Clinician</option>
    </select>

    <label>ID (8 digits — clinicians end in 0000, patients end in a year 2022-2028)</label>
    <input type="text" name="user_id" maxlength="8" required>

    <label>Full Name</label>
    <input type="text" name="name" required>

    <label>Email</label>
    <input type="email" name="email" required>

    <label>Password (min 8 chars, upper+lower+digit+special char)</label>
    <input type="password" name="password" required>

    <button type="submit">Register</button>
</form>
<p>Already have an account? <a href="{{ url_for('auth.login') }}">Log in</a></p>
{% endblock %}
